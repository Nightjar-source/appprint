        tailwind.config = {

                extend: {
                    fontFamily: {

    <style>
        /* ==========================================================================
           1. LIQUID FLUID TRANSITIONS
           ========================================================================== */
        /* Fluid capsule sliding transition with hydraulic spring physics */
        .liquid-capsule-transition {
            transition: transform 0.48s cubic-bezier(0.38, 1.65, 0.6, 1), 
                        width 0.48s cubic-bezier(0.38, 1.65, 0.6, 1),
                        height 0.48s cubic-bezier(0.38, 1.65, 0.6, 1),
                        opacity 0.25s ease;
        }

        /* Smooth expansion for child labels and icons inside the active capsule */
        .fluid-grow-transition {
            transition: transform 0.4s cubic-bezier(0.38, 1.65, 0.6, 1),
                        opacity 0.3s ease, 
                        max-width 0.45s cubic-bezier(0.38, 1.65, 0.6, 1),
                        margin 0.3s ease;
        }

        /* ==========================================================================
           2. WATER DROP GLASS CAPSULE
           ========================================================================== */
        .water-drop-glass {
            background: linear-gradient(
                135deg, 
                rgba(255, 255, 255, 0.88) 0%, 
                rgba(255, 255, 255, 0.35) 45%,
                rgba(255, 255, 255, 0.7) 100%
            );
            backdrop-filter: blur(24px) saturate(220%);
            -webkit-backdrop-filter: blur(24px) saturate(220%);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            box-shadow: 
                0 12px 30px -6px rgba(103, 80, 164, 0.35),
                inset 0 2px 5px 0 rgba(255, 255, 255, 0.95),
                inset 0 -3px 7px 0 rgba(103, 80, 164, 0.25);
        }

        .dark .water-drop-glass {
            background: linear-gradient(
                135deg, 
                rgba(255, 255, 255, 0.32) 0%, 
                rgba(255, 255, 255, 0.1) 50%,
                rgba(255, 255, 255, 0.25) 100%
            );
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 12px 30px -6px rgba(0, 0, 0, 0.65),
                inset 0 2px 5px 0 rgba(255, 255, 255, 0.55),
                inset 0 -3px 7px 0 rgba(0, 0, 0, 0.45);
        }

        /* Fluid Pop Animation */
        @keyframes liquidPop {
            0% { transform: scale(0.88); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .liquid-pop-active {
            animation: liquidPop 0.45s cubic-bezier(0.38, 1.65, 0.6, 1);
        }

        /* Prevent accidental text selection during drag/touch */
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: pan-y;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 dark:from-gray-950 dark:via-purple-950/50 dark:to-slate-900 text-gray-900 dark:text-gray-100 h-full font-sans transition-colors duration-500 flex flex-col md:flex-row justify-between overflow-x-hidden no-select">

    <!-- ==========================================================================

    <!-- 
    ----------------------------------------------------------------------------
    📌 DEVELOPER HANDBOOK
    ----------------------------------------------------------------------------
    
    1. Adaptive Layout Architecture:
       - Small Screens (< 768px): Floating bottom bar with horizontally expanding items.
       - Large Screens (>= 768px - Breakpoint `md:`): Sleek vertical sidebar (`md:w-20` / 80px)
         anchored on the left side with vertical item distribution.

    2. Liquid Indicator Tracker Engine:
       - `syncIndicator()` calculates real-time `leftOffset` & `topOffset` with exact element bounds.
       - In desktop mode, the liquid glass capsule glides vertically to wrap the active item seamlessly.

    3. Responsive Scaling & Fluid Physics:
       - Inactive items display a small preview sub-label underneath the icon.
       - Active item expands smoothly into a side-by-side or stacked pill shape inside the water droplet.

    -->

    <!-- Top Header -->

            <p class="text-xs text-purple-700/80 dark:text-purple-300/70 font-medium">Bottom bar on mobile / Sleek sidebar (80px) on desktop</p>
        </div>

    <!-- Main Content Showcase -->
    <main class="flex-1 max-w-md md:max-w-xl mx-auto w-full px-6 flex items-center justify-center relative z-10 my-auto">

        <div id="contentCard" class="w-full bg-white/40 dark:bg-black/30 backdrop-blur-2xl rounded-3xl p-8 shadow-xl border border-white/70 dark:border-white/10 text-center transition-all duration-300 transform scale-100">
            <div id="contentIcon" class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-purple-500/15 text-purple-800 dark:text-purple-200 flex items-center justify-center backdrop-blur-md border border-purple-500/20">
                <!-- Dynamic Content Icon -->
            </div>
            <h2 id="contentTitle" class="text-2xl font-bold mb-2">Home</h2>

    </main>

    <!-- Floating Navigation Container: Bottom bar on Mobile / Left Sidebar on Desktop -->
    <div class="sticky bottom-0 left-0 right-0 p-5 pb-7 md:p-6 md:fixed md:left-6 md:top-1/2 md:-translate-y-1/2 md:bottom-auto md:right-auto flex justify-center z-50">
        
        <!-- Adaptive Floating Nav Capsule -->
        <nav id="navContainer" class="relative bg-white/40 dark:bg-black/40 backdrop-blur-2xl p-2 rounded-full md:rounded-3xl shadow-2xl border border-white/70 dark:border-white/10 flex flex-row md:flex-col items-center gap-1.5 md:gap-2.5 transition-all duration-500 shadow-purple-950/10 md:w-20">
            
            <!-- Dynamic Liquid Glass Indicator -->
            <div id="liquidIndicator" class="absolute rounded-full md:rounded-2xl water-drop-glass liquid-capsule-transition pointer-events-none z-0 opacity-0" style="left: 0px; top: 0px;"></div>

            <!-- Item 1: Home -->
            <button data-index="0" class="nav-item relative z-10 flex items-center justify-center h-12 md:h-16 rounded-full md:rounded-2xl px-3.5 md:px-1 cursor-pointer select-none group transition-all duration-300 w-auto md:w-full">
                <div class="item-content flex flex-row md:flex-col items-center justify-center gap-2 md:gap-0.5 w-full">
                    <div class="icon-container flex flex-col items-center justify-center fluid-grow-transition transform scale-90">
                        <svg class="w-5 h-5 stroke-current transition-all duration-300" fill="none" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        <span class="sub-label text-[9px] font-bold mt-0.5 opacity-70 transition-all duration-300">Home</span>
                    </div>
                    <span class="full-label whitespace-nowrap overflow-hidden font-extrabold text-sm md:text-[10.5px] opacity-0 max-w-0 md:max-w-none fluid-grow-transition">
                        Home

            </button>

            <!-- Item 2: Explore -->
            <button data-index="1" class="nav-item relative z-10 flex items-center justify-center h-12 md:h-16 rounded-full md:rounded-2xl px-3.5 md:px-1 cursor-pointer select-none group transition-all duration-300 w-auto md:w-full">
                <div class="item-content flex flex-row md:flex-col items-center justify-center gap-2 md:gap-0.5 w-full">
                    <div class="icon-container flex flex-col items-center justify-center fluid-grow-transition transform scale-90">
                        <svg class="w-5 h-5 stroke-current transition-all duration-300" fill="none" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <span class="sub-label text-[9px] font-bold mt-0.5 opacity-70 transition-all duration-300">Explore</span>
                    </div>
                    <span class="full-label whitespace-nowrap overflow-hidden font-extrabold text-sm md:text-[10.5px] opacity-0 max-w-0 md:max-w-none fluid-grow-transition">
                        Explore
                    </span>
                </div>
            </button>

            <!-- Item 3: Favorites -->
            <button data-index="2" class="nav-item relative z-10 flex items-center justify-center h-12 md:h-16 rounded-full md:rounded-2xl px-3.5 md:px-1 cursor-pointer select-none group transition-all duration-300 w-auto md:w-full">
                <div class="item-content flex flex-row md:flex-col items-center justify-center gap-2 md:gap-0.5 w-full">
                    <div class="icon-container flex flex-col items-center justify-center fluid-grow-transition transform scale-90">
                        <svg class="w-5 h-5 stroke-current transition-all duration-300" fill="none" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>

                <div class="item-content flex flex-row md:flex-col items-center justify-center gap-2 md:gap-0.5 w-full">
                    <div class="icon-container flex flex-col items-center justify-center fluid-grow-transition transform scale-90">
                        <svg class="w-5 h-5 stroke-current transition-all duration-300" fill="none" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>

                        <span class="sub-label text-[9px] font-bold mt-0.5 opacity-70 transition-all duration-300">Settings</span>

            </button>

        </nav>
    </div>

    <script>
        const tabsData = [
            {
                title: "Home Screen",
                desc: "The sidebar maintains a sleek 80px width on desktop screens, preventing overflow and ensuring a clean viewport.",
                icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>`
            },
            {
                title: "Explore Features",
                desc: "The liquid glass bubble slides vertically on large screens to wrap the selected destination like an organic droplet.",
                icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>`
            },
            {
                title: "Personal Favorites",
                desc: "Icons and text tags expand smoothly inside the water indicator without altering the sidebar width.",
                icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>`
            },
            {
                title: "Application Settings",
                desc: "The tracking engine dynamically calculates coordinates across screen rotation and breakpoint transitions.",
                icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>`
            }
        ];

        let activeIndex = 0;
        let isDragging = false;
        let animationFrameId = null;

        const navContainer = document.getElementById('navContainer');
        const liquidIndicator = document.getElementById('liquidIndicator');
        const navItems = document.querySelectorAll('.nav-item');

        /**
         * Synchronize indicator position and dimensions
         */
        function syncIndicator() {
            const activeItem = navItems[activeIndex];
            if (!activeItem) return;

            const navRect = navContainer.getBoundingClientRect();
            const itemRect = activeItem.getBoundingClientRect();

            const leftOffset = itemRect.left - navRect.left;
            const topOffset = itemRect.top - navRect.top;
            const itemWidth = itemRect.width;
            const itemHeight = itemRect.height;

            liquidIndicator.style.transform = `translate(${leftOffset}px, ${topOffset}px)`;
            liquidIndicator.style.width = `${itemWidth}px`;
            liquidIndicator.style.height = `${itemHeight}px`;
            liquidIndicator.style.opacity = '1';
        }

        /**
         * Track expansion animation smoothly
         */
        function animateIndicator() {
            const startTime = performance.now();
            const duration = 450;

            function step(currentTime) {
                syncIndicator();
                if (currentTime - startTime < duration) {
                    animationFrameId = requestAnimationFrame(step);
                } else {
                    syncIndicator();
                }
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(step);
        }

        /**
         * Activate tab and update styling
         */
        function setActiveTab(index) {
            activeIndex = index;
            const isDesktop = window.innerWidth >= 768;

            navItems.forEach((item, i) => {
                const iconContainer = item.querySelector('.icon-container');
                const fullLabel = item.querySelector('.full-label');
                const subLabel = item.querySelector('.sub-label');

                if (i === activeIndex) {
                    item.classList.add('text-purple-950', 'dark:text-white');
                    item.classList.remove('text-gray-700', 'dark:text-gray-300');

                    iconContainer.style.transform = 'scale(1.12)';

                    if (isDesktop) {
                        subLabel.style.display = 'none';
                        fullLabel.style.maxWidth = 'none';
                        fullLabel.style.opacity = '1';
                        fullLabel.style.transform = 'scale(1)';
                    } else {
                        subLabel.style.display = 'none';
                        fullLabel.style.maxWidth = '100px';
                        fullLabel.style.opacity = '1';
                        fullLabel.style.transform = 'scale(1)';
                    }

                    item.classList.remove('liquid-pop-active');
                    void item.offsetWidth;
                    item.classList.add('liquid-pop-active');

                } else {
                    item.classList.remove('text-purple-950', 'dark:text-white', 'liquid-pop-active');
                    item.classList.add('text-gray-700', 'dark:text-gray-300');

                    iconContainer.style.transform = 'scale(0.9)';

                    if (isDesktop) {
                        subLabel.style.display = 'none';
                        fullLabel.style.maxWidth = 'none';
                        fullLabel.style.opacity = '0.7';
                        fullLabel.style.transform = 'scale(0.85)';
                    } else {
                        subLabel.style.display = 'block';
                        fullLabel.style.maxWidth = '0px';
                        fullLabel.style.opacity = '0';
                        fullLabel.style.transform = 'scale(0.8)';
                    }
                }
            });

            animateIndicator();
            updateContentCard(index);
        }

        function updateContentCard(index) {
            const contentCard = document.getElementById('contentCard');
            contentCard.style.opacity = '0';
            contentCard.style.transform = 'scale(0.95)';

            setTimeout(() => {
                document.getElementById('contentIcon').innerHTML = tabsData[index].icon;
                document.getElementById('contentTitle').innerText = tabsData[index].title;
                document.getElementById('contentDesc').innerText = tabsData[index].desc;
                
                contentCard.style.opacity = '1';
                contentCard.style.transform = 'scale(1)';
            }, 150);
        }

        /**
         * Get closest tab based on touch coordinates
         */
        function getClosestTabIndex(clientX, clientY) {
            let closestIndex = activeIndex;
            let minDistance = Infinity;

            navItems.forEach((item, index) => {
                const rect = item.getBoundingClientRect();
                const itemCenterX = rect.left + rect.width / 2;
                const itemCenterY = rect.top + rect.height / 2;
                
                const distance = Math.hypot(clientX - itemCenterX, clientY - itemCenterY);

                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });

            return closestIndex;
        }

        navItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                setActiveTab(index);
            });
        });

        // Touch & Drag Gesture Events
        navContainer.addEventListener('touchstart', (e) => {
            isDragging = true;
            const touch = e.touches[0];
            const targetIndex = getClosestTabIndex(touch.clientX, touch.clientY);
            setActiveTab(targetIndex);
        }, { passive: true });

        navContainer.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            const targetIndex = getClosestTabIndex(touch.clientX, touch.clientY);
            
            if (targetIndex !== activeIndex) {
                setActiveTab(targetIndex);
            }
        }, { passive: true });

        navContainer.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            
            if (isDark) {
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>`;
            } else {
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>`;
            }
            
            setTimeout(() => setActiveTab(activeIndex), 50);
        });

        // Resize Listener
        window.addEventListener('resize', () => {
            setActiveTab(activeIndex);
        });

        window.onload = () => {
            setActiveTab(0);
        };
    </script>
</body>
