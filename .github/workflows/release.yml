name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Android SDK 37.1 (Compose 1.13)
        run: |
          set -e
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/platform.zip" https://dl.google.com/android/repository/platform-37.1_r01.zip
          unzip -q "$TMP/platform.zip" -d "$TMP/pkg"
          mkdir -p "$ANDROID_HOME/platforms"
          if [ -d "$TMP/pkg/android-37.1" ]; then
            rm -rf "$ANDROID_HOME/platforms/android-37.1"
            mv "$TMP/pkg/android-37.1" "$ANDROID_HOME/platforms/"
          else
            mkdir -p "$ANDROID_HOME/platforms/android-37.1"
            cp -R "$TMP/pkg"/. "$ANDROID_HOME/platforms/android-37.1/"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile & run unit tests
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug --stacktrace

  build-release:
    name: Build Official Signed APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Android SDK 37.1 (Compose 1.13)
        run: |
          set -e
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/platform.zip" https://dl.google.com/android/repository/platform-37.1_r01.zip
          unzip -q "$TMP/platform.zip" -d "$TMP/pkg"
          mkdir -p "$ANDROID_HOME/platforms"
          if [ -d "$TMP/pkg/android-37.1" ]; then
            rm -rf "$ANDROID_HOME/platforms/android-37.1"
            mv "$TMP/pkg/android-37.1" "$ANDROID_HOME/platforms/"
          else
            mkdir -p "$ANDROID_HOME/platforms/android-37.1"
            cp -R "$TMP/pkg"/. "$ANDROID_HOME/platforms/android-37.1/"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
          {
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-19941994}"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-19941994}"
          } >> local.properties

      - name: Build official release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          NAMED_APK="androidApp/build/outputs/apk/release/appprint-release.apk"
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "$NAMED_APK"
            echo "named_apk=$NAMED_APK" >> "$GITHUB_OUTPUT"
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appprint-signed-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}

      - name: Compute release version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}
          name: AppPrint ${{ github.ref_name }}
          body: |
            # طبعتي — AppPrint ${{ github.ref_name }}

            استوديو الطباعة الذكي 1:1 — Compose Multiplatform مع Material 3 1.5 وCompose 1.13.

            ## التنزيلات المباشرة
            - [Android APK (موقّع)](https://github.com/Nightjar-source/appprint/releases/download/${{ github.ref_name }}/appprint-release.apk)
            - [Windows EXE (مثبّت)](https://github.com/Nightjar-source/appprint/releases/download/${{ github.ref_name }}/AppPrint-${{ env.VERSION }}.exe)
            - [Windows MSI](https://github.com/Nightjar-source/appprint/releases/download/${{ github.ref_name }}/AppPrint-${{ env.VERSION }}.msi)
            - [Windows محمول ZIP (يعمل بدون تثبيت)](https://github.com/Nightjar-source/appprint/releases/download/${{ github.ref_name }}/AppPrint-portable.zip)
            - [PWA / إصدار الويب](https://nightjar-source.github.io/appprint/)
            - [أرشيف PWA](https://github.com/Nightjar-source/appprint/releases/download/${{ github.ref_name }}/appprint-pwa.zip)

            ## ما الجديد
            - الورقة لم تعد تُسحب أو تختفي: تبقى دائماً في وسط المساحة الآمنة مع تكبير ناعم.
            - حماية المحتوى من شريط الحالة والكاميرات والحواف على الهاتف والأجهزة الكبيرة والمطويات.
            - ارتداد التوست بنابض بدل القفز، وإصلاح كتابة ملف الطباعة لأنظمة أندرويد.
            - إصلاح عامل خدمة PWA (الملفات المجزّأة .wasm) وإضافة معرّف التطبيق.
            - حزمة Windows محمولة كاملة إلى جانب المثبّت MSI.

