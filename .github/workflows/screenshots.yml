name: Screenshot (Robolectric)

# Renders the real Compose UI on Robolectric and commits the PNGs into
# screenshots/ so they can be reviewed against the HTML reference design.
# The bot commit carries [skip ci] to avoid triggering itself.

on:
  push:
    branches: [ main ]
    paths:
      - 'shared/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Compose screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install Android SDK 37.1 (Compose 1.13)
        run: |
          set -e
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/platform.zip" https://dl.google.com/android/repository/platform-37.1_r01.zip
          unzip -q "$TMP/platform.zip" -d "$TMP/pkg"
          mkdir -p "$ANDROID_HOME/platforms"
          if [ -d "$TMP/pkg/android-37.1" ]; then
            rm -rf "$ANDROID_HOME/platforms/android-37.1"
            mv "$TMP/pkg/android-37.1" "$ANDROID_HOME/platforms/"
          else
            mkdir -p "$ANDROID_HOME/platforms/android-37.1"
            cp -R "$TMP/pkg"/. "$ANDROID_HOME/platforms/android-37.1/"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Robolectric screenshot tests
        run: |
          set +e
          ./gradlew :shared:testAndroidHostTest --tests "*StudioScreenshotTest*" --tests "*StudioInteractionTest*" --console=plain --stacktrace > shots.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "----- gradle errors -----"
            grep -E "^e: |What went wrong|FAILED|Execution failed|error:" shots.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            echo "----- dependency / sdk messages -----"
            grep -iE "compileSdk|Platform SDK|AarMetadata|Dependency |requires|minCompileSdk|Unsupported|Could not|Not Found|Unable|artifact|resource|Download" shots.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
            echo "----- test report stack traces -----"
            python3 - <<'PY'
          import glob, re
          import xml.etree.ElementTree as ET
          out = []
          for f in glob.glob('shared/build/test-results/testAndroidHostTest/*.xml'):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  for err in list(tc.iter('error')) + list(tc.iter('failure')):
                      out.append('TEST ' + tc.get('classname', '') + '.' + tc.get('name', ''))
                      text = (err.text or '') + '\n' + (err.get('message', '') or '')
                      lines = [l.strip() for l in text.splitlines()]
                      exceptions = [l for l in lines if re.match(r'^[A-Za-z_.$][\w.$]*(Exception|Error|Cause)', l)]
                      caused = [l for l in lines if l.startswith('Caused by')]
                      appprint = [l for l in lines if 'at com.appprint' in l]
                      out += exceptions[:1] + caused[:2] + appprint[:6]
          for line in out[:9]:
              print('::error::' + line[:300])
          PY
            echo "----- tail -----"
            tail -15 shots.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Commit screenshots
        run: |
          if [ ! -d shared/build/screenshots ]; then
            echo "::warning::No screenshots were produced"
            exit 0
          fi
          mkdir -p screenshots
          cp -f shared/build/screenshots/*.png screenshots/ || true
          ls -la screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if git diff --cached --quiet; then
            echo "Screenshots unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(screenshots): refresh from CI" -m "[skip ci]"
          git push origin HEAD:main
