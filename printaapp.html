    :root {
      /* //*** Kotlin Compose LightColorScheme Tokens */
      --md-primary: #006C47;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #8CF7C2;
      --md-on-primary-container: #002113;

      --md-secondary: #4D6356;
      --md-on-secondary: #FFFFFF;
      --md-secondary-container: #CFE9D8;
      --md-on-secondary-container: #0A1F15;

      --md-tertiary: #B32638;
      --md-on-tertiary: #FFFFFF;
      --md-tertiary-container: #FFDAD9;
      --md-on-tertiary-container: #40000B;

      --md-bg: #F3F7F4;
      --md-on-bg: #161D19;
      --md-surface: #F3F7F4;
      --md-on-surface: #161D19;
      --md-on-surface-variant: #3F4943;

      --md-surface-lowest: #FFFFFF;
      --md-surface-low: #ECF1ED;
      --md-surface-container: #E6ECE8;
      --md-surface-high: #E0E6E2;
      --md-surface-highest: #DAE0DC;

      --md-outline: #707973;
      --md-outline-variant: #BFC9C1;
      --md-canvas: #D8DFDA;

      /* //*** Ultra-Fluid Damped Spring Physics Curves (Silky Wet Spring Feel) */
      --fluid-spring-fast: cubic-bezier(0.28, 1.38, 0.42, 1);
      --fluid-spring-default: cubic-bezier(0.20, 1.24, 0.34, 1);
      --fluid-spring-silk: cubic-bezier(0.16, 1.12, 0.28, 1);
      --fluid-effects: cubic-bezier(0.18, 0.0, 0.12, 1.0);

      /* //*** Adaptive Compact Heights (<56.dp Portrait TopBar, <48.dp Landscape TopBar) */
      --top-bar-h: 48px;
      --nav-bar-h: 56px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    /* //*** Kotlin Compose DarkColorScheme Tokens */
    html[data-theme="dark"] {
      --md-primary: #70DBA7;
      --md-on-primary: #003823;
      --md-primary-container: #005235;
      --md-on-primary-container: #8CF7C2;

      --md-secondary: #B4CCBC;
      --md-on-secondary: #1F352A;
      --md-secondary-container: #354B3F;
      --md-on-secondary-container: #CFE9D8;

      --md-tertiary: #FFB3B6;
      --md-on-tertiary: #680016;
      --md-tertiary-container: #910824;
      --md-on-tertiary-container: #FFDAD9;

      --md-bg: #0E1512;
      --md-on-bg: #DEE4DF;
      --md-surface: #0E1512;
      --md-on-surface: #DEE4DF;
      --md-on-surface-variant: #BFC9C1;

      --md-surface-lowest: #090E0C;
      --md-surface-low: #161D1A;
      --md-surface-container: #1A211E;
      --md-surface-high: #242B28;
      --md-surface-highest: #2F3633;

      --md-outline: #89938C;
      --md-outline-variant: #3F4943;
      --md-canvas: #070B09;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --md-primary: #70DBA7;
        --md-on-primary: #003823;
        --md-primary-container: #005235;
        --md-on-primary-container: #8CF7C2;

        --md-secondary: #B4CCBC;
        --md-on-secondary: #1F352A;
        --md-secondary-container: #354B3F;
        --md-on-secondary-container: #CFE9D8;

        --md-tertiary: #FFB3B6;
        --md-on-tertiary: #680016;
        --md-tertiary-container: #910824;
        --md-on-tertiary-container: #FFDAD9;

        --md-bg: #0E1512;
        --md-on-bg: #DEE4DF;
        --md-surface: #0E1512;
        --md-on-surface: #DEE4DF;
        --md-on-surface-variant: #BFC9C1;

        --md-surface-lowest: #090E0C;
        --md-surface-low: #161D1A;
        --md-surface-container: #1A211E;
        --md-surface-high: #242B28;
        --md-surface-highest: #2F3633;

        --md-outline: #89938C;
        --md-outline-variant: #3F4943;
        --md-canvas: #070B09;
      }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      :root {
        --top-bar-h: 40px;
        --nav-bar-h: 46px;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Cairo", system-ui, -apple-system, sans-serif;
      background-color: var(--md-bg);
      color: var(--md-on-surface);
      overscroll-behavior: none;
    }

    .font-reem-kufi {
      font-family: "Reem Kufi", "Cairo", sans-serif;
    }

    input[type="text"], input[type="number"], select {
      background-color: var(--md-surface-highest);
      color: var(--md-on-surface);
      border-color: var(--md-outline-variant);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* //*** Ultra-Fluid Spring Motion System */
    .fluid-spring {
      transition:
        transform 520ms var(--fluid-spring-default),
        opacity 360ms var(--fluid-effects),
        width 520ms var(--fluid-spring-default),
        height 520ms var(--fluid-spring-default),
        background-color 300ms var(--fluid-effects),
        border-color 300ms var(--fluid-effects),
        box-shadow 360ms var(--fluid-effects);
    }

    .fluid-btn {
      position: relative;
      overflow: hidden;
      will-change: transform, border-radius;
      transition:
        transform 400ms var(--fluid-spring-fast),
        border-radius 380ms var(--fluid-spring-fast),
        background-color 260ms var(--fluid-effects),
        color 260ms var(--fluid-effects),
        box-shadow 300ms var(--fluid-effects),
        opacity 240ms ease;
    }
    .fluid-btn:hover {
      transform: translateY(-1.5px) scale(1.03);
    }
    .fluid-btn:active {
      transform: scale(0.88);
      border-radius: 14px;
    }

    /* Floating Glass Pill Container */
    .m3-glass-pill {
      background-color: color-mix(in srgb, var(--md-surface-low) 90%, transparent);
      border: 1px solid var(--md-outline-variant);
      backdrop-filter: blur(22px) saturate(1.3);
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.22), 0 3px 10px -2px rgba(0, 0, 0, 0.11);
      transition:
        transform 480ms var(--fluid-spring-default),
        background-color 300ms ease,
        border-color 300ms ease,
        box-shadow 360ms ease;
    }

    /* Fluid Active Nav Indicator Pill */
    @keyframes fluidPillMorph {
      0% { transform: scaleX(0.36) scaleY(0.72); opacity: 0.3; border-radius: 12px; }
      62% { transform: scaleX(1.09) scaleY(1.05); opacity: 1; border-radius: 9999px; }
      100% { transform: scaleX(1) scaleY(1); opacity: 1; border-radius: 9999px; }
    }
    .m3-nav-indicator {
      background-color: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
      animation: fluidPillMorph 460ms var(--fluid-spring-fast) forwards;
    }

    @keyframes fluidFloatEnter {
      0% { opacity: 0; transform: scale(0.72) translateY(-10px); }
      68% { opacity: 1; transform: scale(1.04) translateY(1px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .m3-float-enter {
      animation: fluidFloatEnter 460ms var(--fluid-spring-fast) forwards;
    }

    /* Fluid Tab Content Cross-Fade & Glide */
    @keyframes fluidTabEnter {
      0% { opacity: 0; transform: translateY(16px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .fluid-tab-content {
      animation: fluidTabEnter 420ms var(--fluid-spring-silk) forwards;
    }

    /* Fluid Edit Drawer Entrance */
    @keyframes fluidDrawerMobile {
      0% { opacity: 0; transform: translateY(100%) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fluidDrawerDesktop {
      0% { opacity: 0; transform: translateX(-52px) scale(0.96); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .fluid-drawer-mobile {
      animation: fluidDrawerMobile 500ms var(--fluid-spring-default) forwards;
    }
    @media (min-width: 768px) {
      .fluid-drawer-desktop {
        animation: fluidDrawerDesktop 500ms var(--fluid-spring-default) forwards;
      }
    }

    /* Fluid Modal Backdrop & Spring Sheet Dialog */
    .m3-backdrop {
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      transition: opacity 340ms var(--fluid-effects), backdrop-filter 360ms ease;
    }
    .m3-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .m3-dialog {
      transform: translateY(48px) scale(0.86);
      opacity: 0;
      transition:
        transform 500ms var(--fluid-spring-default),
        opacity 300ms var(--fluid-effects);
    }
    .m3-backdrop.is-open .m3-dialog {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Long Press Ripple Pulse Ring */
    @keyframes longPressPulse {
      0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(0, 108, 71, 0.5); }
      70% { transform: scale(1.035); box-shadow: 0 0 0 14px rgba(0, 108, 71, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 108, 71, 0); }
    }
    .card-long-pressing {
      animation: longPressPulse 430ms var(--fluid-spring-fast) forwards;
    }

    /* M3 Expressive Morphing Starburst Loader */
    @keyframes m3StarMorph {
      0% { transform: rotate(0deg) scale(0.86); border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; }
      33% { transform: rotate(120deg) scale(1.16); border-radius: 22% 78% 44% 56% / 66% 34% 66% 34%; }
      66% { transform: rotate(240deg) scale(0.90); border-radius: 58% 42% 28% 72% / 38% 70% 30% 62%; }
      100% { transform: rotate(360deg) scale(0.86); border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; }
    }
    .m3-star-loader {
      animation: m3StarMorph 1.35s var(--fluid-spring-default) infinite;
    }

    /* Official M3 Expressive Fluid Toggle Switch */
    .m3-switch {
      width: 50px;
      height: 30px;
      border-radius: 9999px;
      padding: 2px;
      display: inline-flex;
      align-items: center;
      position: relative;
      flex-shrink: 0;
      transition: background-color 300ms var(--fluid-effects), border-color 300ms var(--fluid-effects);
    }
    .m3-switch.off {
      background-color: var(--md-surface-highest);
      border: 2px solid var(--md-outline);
    }
    .m3-switch.on {
      background-color: var(--md-primary);
      border: 2px solid var(--md-primary);
    }
    .m3-switch-thumb {
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        transform 420ms var(--fluid-spring-fast),
        width 360ms var(--fluid-spring-fast),
        height 360ms var(--fluid-spring-fast),
        background-color 240ms ease;
    }
    .m3-switch.off .m3-switch-thumb {
      width: 15px;
      height: 15px;
      transform: translateX(-4px);
      background-color: var(--md-outline);
      color: var(--md-surface-highest);
    }
    .m3-switch.on .m3-switch-thumb {
      width: 22px;
      height: 22px;
      transform: translateX(-20px);
      background-color: var(--md-on-primary);
      color: var(--md-primary);
    }

    /* Physical 1:1 Paper Sheet with Fluid Spring */
    .physical-sheet {
      background: #FFFFFF;
      color: #111111;
      box-shadow:
        0 24px 56px -14px rgba(0, 0, 0, 0.36),
        0 6px 18px -4px rgba(0, 0, 0, 0.22),
        0 0 0 1px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: visible;
      flex-shrink: 0;
      transition:
        width 480ms var(--fluid-spring-default),
        height 480ms var(--fluid-spring-default),
        background 300ms ease;
    }

    .card-item {
      position: absolute;
      touch-action: none;
      cursor: grab;
      user-select: none;
      transition:
        left 440ms var(--fluid-spring-default),
        top 440ms var(--fluid-spring-default),
        width 420ms var(--fluid-spring-default),
        height 420ms var(--fluid-spring-default),
        transform 360ms var(--fluid-spring-fast),
        box-shadow 260ms ease,
        outline 200ms ease;
    }
    .card-item.is-interacting {
      transition: box-shadow 200ms ease, outline 160ms ease !important;
    }
    .card-item:active {
      cursor: grabbing;
    }
    .card-item.is-selected {
      outline: 2.5px solid var(--md-primary);
      outline-offset: 2px;
      box-shadow: 0 14px 32px rgba(0, 108, 71, 0.32);
      z-index: 30;
    }

    @page {
      size: auto;
      margin: 0;
    }
    @media print {
      html, body {
        overflow: visible !important;
        height: auto !important;
        background: #FFFFFF !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-container {
        position: static !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        background: #FFFFFF !important;
        display: block !important;
      }
      .sheet-scale-wrapper {
        transform: none !important;
        width: auto !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .physical-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        overflow: hidden !important;
        page-break-after: always;
        break-after: page;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .physical-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .ui-overlay, .resize-grip, .rotate-grip, .badge-tag {
        display: none !important;
      }
    }
  </style>
</head>

    const CLUSTER_COLORS = ["#006C47", "#16324F", "#8A5B12", "#910824", "#4B2D73", "#276B68", "#B32638", "#1F4B7A"];

    function getTotalCardRotation(c) {
      return (((c.rotation || 0) + (c.freeRotation || 0)) % 360 + 360) % 360;

    function getCardSizeKey(c) {
      const rot = getTotalCardRotation(c);
      const isRightAngle = Math.abs(rot - 90) < 1 || Math.abs(rot - 270) < 1;
      const baseW = isRightAngle ? c.h : c.w;
      const baseH = isRightAngle ? c.w : c.h;
      const a = Math.round(baseW / 2) * 2;
      const b = Math.round(baseH / 2) * 2;
      return `${a} × ${b}`;
    }

    function hashClusterColor(key) {
      let h = 0;
      for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
      return CLUSTER_COLORS[h % CLUSTER_COLORS.length];
    }

    function buildSizeClusters(cards) {
      const map = new Map();
      cards.forEach((c) => {

          label: `${key} مم`,
          color: hashClusterColor(key),
          cards: items
        }));

        return { type: "passport", name: "جواز السفر", w: 88, h: 125, detected: `تم التعرف: جواز / مستند عمودي • ${orient} • نسبة ${ratio.toFixed(2)}` };

      if (Math.abs(ratio - 1.42857) < 0.12) {
        return { type: "residence", name: "بطاقة السكن", w: 100, h: 70, detected: `تم التعرف: بطاقة سكن • ${orient} • نسبة ${ratio.toFixed(2)}` };
      }
      if (ratio >= 1) {
        return { type: "custom", name: "قياس مخصص", w: 90, h: Math.max(30, Math.round((90 / ratio) * 10) / 10), detected: `تم التعرف: مخصص • ${orient} • نسبة ${ratio.toFixed(2)}` };
      }
      return { type: "custom", name: "قياس مخصص", w: Math.max(30, Math.round(120 * ratio * 10) / 10), h: 120, detected: `تم التعرف: مخصص • ${orient} • نسبة ${ratio.toFixed(2)}` };
    }

    /* ==========================================================================
       //*** STRICT ZERO-OVERLAP SHELF & POCKET BIN-PACKER
       ========================================================================== */
    function isBoxColliding(a, b, minClearance) {
      return !(
        a.x + a.w + minClearance <= b.x + 0.01 ||
        b.x + b.w + minClearance <= a.x + 0.01 ||
        a.y + a.h + minClearance <= b.y + 0.01 ||
        b.y + b.h + minClearance <= a.y + 0.01
      );
    }

    function arrangeCardsStrict(cards, opts) {
      if (!cards || cards.length === 0) return { cards: [], pages: 1, shrinkPct: 0 };

      const cutBleed = opts.hasCutGuides ? 1.4 : 0;
      const safeMargin = Math.max(opts.margin, cutBleed);
      const baseGap = opts.mode === "comfortable" ? Math.max(opts.gap, 8) : opts.gap;
      const minGap = Math.max(baseGap, cutBleed * 2 + 0.8);

      const printableW = Math.max(20, opts.paperW - safeMargin * 2);
      const printableH = Math.max(20, opts.paperH - safeMargin * 2);
      const strategy = opts.strategy || "smart";

      const normalized = cards.map((c) => {
        const curRot = getTotalCardRotation(c);
        const was90 = Math.abs(curRot - 90) < 1 || Math.abs(curRot - 270) < 1;
        let origW = Number(c.baseW) || (was90 ? Number(c.h) : Number(c.w)) || 85.6;
        let origH = Number(c.baseH) || (was90 ? Number(c.w) : Number(c.h)) || 54;
        let userRot = c.autoRotated ? 0 : (c.rotation || 0);

        let w = origW;
        let h = origH;
        let rot = userRot;
        let autoRotated = false;
        let autoShrunk = false;

        if (w > printableW + 0.05) {
          if (h <= printableW + 0.05 && w <= printableH + 0.05) {
            [w, h] = [h, w];
            rot = (rot + 90) % 360;
            autoRotated = true;
          } else {
            const ratio = printableW / w;
            w = printableW;
            h = h * ratio;
            autoShrunk = true;
          }
        }
        if (h > printableH + 0.05) {
          if (w <= printableH + 0.05 && h <= printableW + 0.05) {
            [w, h] = [h, w];
            rot = (rot + 90) % 360;
            autoRotated = true;
          } else {
            const ratio = printableH / h;
            h = printableH;
            w = w * ratio;
            autoShrunk = true;
          }
        }

        return {
          ...c,
          baseW: origW,
          baseH: origH,
          w: Math.round(w * 10) / 10,
          h: Math.round(h * 10) / 10,
          rotation: rot,
          freeRotation: 0,
          autoRotated,
          autoShrunk
        };
      });

      const clusterCounts = new Map();
      normalized.forEach((c) => {
        const k = getCardSizeKey(c);
        clusterCounts.set(k, (clusterCounts.get(k) || 0) + 1);
      });

      const ordered = [...normalized].sort((a, b) => {
        if (strategy === "size") {
          return (b.w * b.h) - (a.w * a.h) || b.h - a.h || b.w - a.w;
        }
        if (opts.groupSmart) {
          const ka = getCardSizeKey(a);
          const kb = getCardSizeKey(b);
          if (ka !== kb) {
            const diff = (clusterCounts.get(kb) || 0) - (clusterCounts.get(ka) || 0);
            if (diff !== 0) return diff;
            return (b.w * b.h) - (a.w * a.h);
          }
          return 0;
        }
        return (b.w * b.h) - (a.w * a.h);
      });

      if (opts.mode === "grid") {
        const cellW = Math.min(printableW, Math.max(...ordered.map((c) => c.w), 0));
        const cellH = Math.min(printableH, Math.max(...ordered.map((c) => c.h), 0));
        let cx = safeMargin;
        let cy = safeMargin;
        let page = 0;
        const placed = [];

        for (const c of ordered) {
          if (cx + cellW > opts.paperW - safeMargin + 0.05 && cx > safeMargin) {
            cx = safeMargin;
            cy += cellH + minGap;
          }
          if (cy + cellH > opts.paperH - safeMargin + 0.05 && placed.length > 0) {
            page++;
            cx = safeMargin;
            cy = safeMargin;
          }
          placed.push({
            ...c,
            x: Math.round((cx + (cellW - c.w) / 2) * 10) / 10,
            y: Math.round((cy + (cellH - c.h) / 2) * 10) / 10,
            page,
            manual: false
          });
          cx += cellW + minGap;
        }
        return { cards: placed, pages: Math.max(1, page + 1), shrinkPct: 0 };
      }

      if (strategy === "size") {
        let cx = safeMargin;
        let cy = safeMargin;
        let rowH = 0;
        let page = 0;
        const placed = [];

        for (const c of ordered) {
          if (cx + c.w > opts.paperW - safeMargin + 0.05 && cx > safeMargin) {
            cx = safeMargin;
            cy += rowH + minGap;
            rowH = 0;
          }
          if (cy + c.h > opts.paperH - safeMargin + 0.05 && placed.length > 0) {
            page += 1;
            cx = safeMargin;
            cy = safeMargin;
            rowH = 0;
          }
          placed.push({
            ...c,
            x: Math.round(cx * 10) / 10,
            y: Math.round(cy * 10) / 10,
            page,
            manual: false
          });
          cx += c.w + minGap;
          rowH = Math.max(rowH, c.h);
        }
        return { cards: placed, pages: Math.max(1, page + 1), shrinkPct: 0 };
      }

      const runSmartPermutation = (flipClusters, scanAxis) => {
        const pageBuckets = [[]];
        const placedList = [];

        const pinned = opts.preserveManual ? ordered.filter((c) => c.manual) : [];
        const unpinned = opts.preserveManual ? ordered.filter((c) => !c.manual) : ordered;

        for (const pCard of pinned) {
          const pIdx = Math.max(0, pCard.page || 0);
          while (pageBuckets.length <= pIdx) pageBuckets.push([]);
          const clampedX = Math.max(safeMargin, Math.min(opts.paperW - safeMargin - pCard.w, pCard.x));
          const clampedY = Math.max(safeMargin, Math.min(opts.paperH - safeMargin - pCard.h, pCard.y));
          const item = { ...pCard, x: Math.round(clampedX * 10) / 10, y: Math.round(clampedY * 10) / 10, page: pIdx };
          pageBuckets[pIdx].push(item);
          placedList.push(item);
        }

        const preparedUnpinned = unpinned.map((c) => {
          if (flipClusters && Math.abs(c.w - c.h) > 1 && c.h <= printableW + 0.05 && c.w <= printableH + 0.05) {
            const capNorm =
              Math.floor((printableW + minGap) / (c.w + minGap)) *
              Math.floor((printableH + minGap) / (c.h + minGap));
            const capFlip =
              Math.floor((printableW + minGap) / (c.h + minGap)) *
              Math.floor((printableH + minGap) / (c.w + minGap));
            if (capFlip > capNorm) {
              return {
                ...c,
                w: c.h,
                h: c.w,
                rotation: ((c.rotation || 0) + 90) % 360,
                autoRotated: true
              };
            }
          }
          return c;
        });

        const findSmartSlot = (pageItems, cw, ch) => {
          const xs = new Set([safeMargin]);
          const ys = new Set([safeMargin]);
          for (const p of pageItems) {
            xs.add(Math.round((p.x + p.w + minGap) * 10) / 10);
            xs.add(Math.round(p.x * 10) / 10);
            ys.add(Math.round((p.y + p.h + minGap) * 10) / 10);
            ys.add(Math.round(p.y * 10) / 10);
          }
          const sortedXs = [...xs].sort((a, b) => a - b);
          const sortedYs = [...ys].sort((a, b) => a - b);

          const orientations = [
            { w: cw, h: ch, rotated: false },
            ...(Math.abs(cw - ch) > 1 ? [{ w: ch, h: cw, rotated: true }] : [])
          ];

          for (const or of orientations) {
            if (or.w > printableW + 0.05 || or.h > printableH + 0.05) continue;
            if (scanAxis === "row") {
              for (const y of sortedYs) {
                if (y < safeMargin - 0.01 || y + or.h > opts.paperH - safeMargin + 0.05) continue;
                for (const x of sortedXs) {
                  if (x < safeMargin - 0.01 || x + or.w > opts.paperW - safeMargin + 0.05) continue;
                  const box = { x, y, w: or.w, h: or.h };
                  if (!pageItems.some((existing) => isBoxColliding(box, existing, minGap - 0.05))) {
                    return { ...box, rotated: or.rotated };
                  }
                }
              }
            } else {
              for (const x of sortedXs) {
                if (x < safeMargin - 0.01 || x + or.w > opts.paperW - safeMargin + 0.05) continue;
                for (const y of sortedYs) {
                  if (y < safeMargin - 0.01 || y + or.h > opts.paperH - safeMargin + 0.05) continue;
                  const box = { x, y, w: or.w, h: or.h };
                  if (!pageItems.some((existing) => isBoxColliding(box, existing, minGap - 0.05))) {
                    return { ...box, rotated: or.rotated };
                  }
                }
              }
            }
          }
          return null;
        };

        for (const card of preparedUnpinned) {
          let placed = false;
          for (let p = 0; p < pageBuckets.length; p++) {
            const slot = findSmartSlot(pageBuckets[p], card.w, card.h);
            if (slot) {
              const placedItem = {
                ...card,
                x: slot.x,
                y: slot.y,
                w: slot.w,
                h: slot.h,
                rotation: slot.rotated ? ((card.rotation || 0) + 90) % 360 : card.rotation,
                autoRotated: slot.rotated || card.autoRotated,
                manual: false,
                page: p
              };
              pageBuckets[p].push(placedItem);
              placedList.push(placedItem);
              placed = true;
              break;
            }
          }

          if (!placed) {
            const targetPage = pageBuckets.length;
            pageBuckets.push([]);
            const placedItem = {
              ...card,
              x: Math.round(safeMargin * 10) / 10,
              y: Math.round(safeMargin * 10) / 10,
              manual: false,
              page: targetPage
            };
            pageBuckets[targetPage].push(placedItem);
            placedList.push(placedItem);
          }
        }

        const maxBottom = placedList.reduce((acc, item) => Math.max(acc, item.y + item.h), 0);
        const rotPenalty = placedList.filter((item) => item.autoRotated).length * 2;
        return {
          cards: placedList.sort((a, b) => (a.page || 0) - (b.page || 0) || a.y - b.y || a.x - b.x),
          pages: pageBuckets.length,
          score: pageBuckets.length * 100000 + maxBottom + rotPenalty
        };
      };

      const candidates = [
        runSmartPermutation(false, "row"),
        runSmartPermutation(true, "row"),
        runSmartPermutation(false, "col"),
        runSmartPermutation(true, "col")
      ];
      candidates.sort((a, b) => a.score - b.score);
      const best = candidates[0];

      return {
        cards: best.cards,
        pages: best.pages,
        shrinkPct: 0
      };
    }

    /* ==========================================================================
       //*** SCANNER IMAGE ENHANCEMENT & PIXEL CONVOLUTION ENGINE
       ========================================================================== */
    function hasActiveEnhancement(enh) {
      if (!enh) return false;
      return (
        (enh.brightness ?? 100) !== 100 ||
        (enh.contrast ?? 100) !== 100 ||
        (enh.saturation ?? 100) !== 100 ||
        (enh.sharpness ?? 100) !== 100 ||
        (enh.mode || "color") !== "color" ||
        !!enh.shadow ||
        (enh.tilt ?? 0) !== 0 ||
        (enh.crop ?? 0) !== 0
      );
    }

    function buildCssScannerFilter(enh) {
      if (!enh) return "none";
      const sharpBoost = 1 + ((enh.sharpness ?? 100) - 100) / 300;
      const contrast = Math.round((enh.contrast ?? 100) * sharpBoost);
      const brightness = enh.shadow
        ? Math.round((enh.brightness ?? 100) * 1.12)
        : (enh.brightness ?? 100);
      const mode = enh.mode || "color";
      if (mode === "bw") {
        return `brightness(${Math.round(brightness * 1.08)}%) contrast(${Math.round(contrast * 1.55)}%) grayscale(1)`;
      }
      if (mode === "gray") {
        return `brightness(${brightness}%) contrast(${contrast}%) grayscale(1)`;
      }
      return `brightness(${brightness}%) contrast(${contrast}%) saturate(${enh.saturation ?? 100}%)`;
    }

    function loadImage(src) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = () => rej(new Error("img"));
        img.src = src;
      });
    }

    async function processCardPixels(src, enh) {
      if (!src) return null;
      if (!enh || !hasActiveEnhancement({ ...enh, tilt: 0, crop: 0 })) return src;

      const img = await loadImage(src);
      const maxDim = 1600;
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
      const w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
      const h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));

      const cvs = document.createElement("canvas");
      cvs.width = w;
      cvs.height = h;
      const ctx = cvs.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const brightFactor = ((enh.brightness ?? 100) / 100) * (enh.shadow ? 1.14 : 1.0);
      const contrastVal = ((enh.contrast ?? 100) - 100) * 2.55;
      const contrastFactor = (259 * (contrastVal + 255)) / (255 * (259 - contrastVal));
      const satFactor = (enh.saturation ?? 100) / 100;
      const mode = enh.mode || "color";
      const removeShadow = !!enh.shadow;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        if (removeShadow) {
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          if (lum > 145) {
            const lift = ((lum - 145) / 110) * 52;
            r += lift;
            g += lift;
            b += lift;
          }
        }

        r *= brightFactor;
        g *= brightFactor;
        b *= brightFactor;

        r = contrastFactor * (r - 128) + 128;
        g = contrastFactor * (g - 128) + 128;
        b = contrastFactor * (b - 128) + 128;

        if (mode === "gray" || mode === "bw") {
          let lum = 0.299 * r + 0.587 * g + 0.114 * b;
          if (mode === "bw") {
            lum = lum > 140 ? Math.min(255, lum * 1.2 + 22) : Math.max(0, lum * 0.7 - 15);
          }
          r = g = b = lum;
        } else if (satFactor !== 1) {
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          r = lum + (r - lum) * satFactor;
          g = lum + (g - lum) * satFactor;
          b = lum + (b - lum) * satFactor;
        }

        data[i] = Math.max(0, Math.min(255, r));
        data[i + 1] = Math.max(0, Math.min(255, g));
        data[i + 2] = Math.max(0, Math.min(255, b));
      }

      const sharp = enh.sharpness ?? 100;
      if (sharp > 100 && w > 4 && h > 4) {
        const amount = ((sharp - 100) / 80) * 0.72;
        const copy = new Uint8ClampedArray(data);
        const rowStride = w * 4;
        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const idx = y * rowStride + x * 4;
            for (let c = 0; c < 3; c++) {
              const center = copy[idx + c];
              const neighbors =
                copy[idx - rowStride + c] +
                copy[idx + rowStride + c] +
                copy[idx - 4 + c] +
                copy[idx + 4 + c];
              data[idx + c] = Math.max(0, Math.min(255, center + amount * (4 * center - neighbors)));
            }
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return cvs.toDataURL("image/jpeg", 0.94);
    }

    /* ==========================================================================
       //*** 300 DPI SHEET CANVAS, NATIVE PDF & HTML PRINT EXPORTERS (360° Aware)
       ========================================================================== */
    async function renderSheetToCanvas(cards, paperW, paperH, margin, frame = DEFAULT_FRAME) {
      const PX_PER_MM = 11.811023622; // 300 DPI
      const W = Math.max(1, Math.round(paperW * PX_PER_MM));
      const H = Math.max(1, Math.round(paperH * PX_PER_MM));
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");

      if (frame.bg === "transparent") ctx.clearRect(0, 0, W, H);
      else {
        ctx.fillStyle = frame.bg === "offwhite" ? "#fdfaf1" : "#ffffff";
        ctx.fillRect(0, 0, W, H);
      }

      if (frame.guides) {
        ctx.save();
        ctx.strokeStyle = "rgba(179, 38, 56, 0.55)";
        ctx.lineWidth = 4.5;
        ctx.setLineDash([22, 22]);
        ctx.strokeRect(
          margin * PX_PER_MM,
          margin * PX_PER_MM,
          Math.max(0, (paperW - margin * 2) * PX_PER_MM),
          Math.max(0, (paperH - margin * 2) * PX_PER_MM)
        );
        ctx.restore();
      }

      if (frame.sheet && frame.color !== "none" && frame.thickness > 0) {
        ctx.save();
        ctx.strokeStyle = frame.color;
        ctx.lineWidth = Math.max(2, frame.thickness * 4);
        if (frame.style === "dashed") ctx.setLineDash([22, 16]);
        else if (frame.style === "dotted") ctx.setLineDash([4, 14]);
        ctx.strokeRect(2, 2, W - 4, H - 4);
        ctx.restore();
      }

      for (const c of cards) {
        const cw = c.w * PX_PER_MM;
        const ch = c.h * PX_PER_MM;
        const cx = (c.x + c.w / 2) * PX_PER_MM;
        const cy = (c.y + c.h / 2) * PX_PER_MM;
        const isRot90 = c.rotation === 90 || c.rotation === 270;
        const innerW = isRot90 ? ch : cw;
        const innerH = isRot90 ? cw : ch;
        const totalAngle = (c.freeRotation || 0) + (c.enhance?.tilt || 0);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((totalAngle * Math.PI) / 180);

        ctx.save();
        ctx.rotate(((c.rotation || 0) * Math.PI) / 180);
        ctx.translate(-innerW / 2, -innerH / 2);

        let src = c.enhancedImage || c.image;
        if (c.image && hasActiveEnhancement(c.enhance) && (!c.enhancedImage || c.enhancedImage === c.image)) {
          try { src = await processCardPixels(c.image, c.enhance); } catch {}
        }

        if (src) {
          try {
            const img = await loadImage(src);
            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            const scale = Math.max(innerW / iw, innerH / ih);
            const sw = innerW / scale;
            const sh = innerH / scale;
            ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, innerW, innerH);
          } catch {
            ctx.fillStyle = "#fdfaf1";
            ctx.fillRect(0, 0, innerW, innerH);
          }
        } else {
          const isPass = c.type === "passport";
          ctx.fillStyle = isPass ? "#17365A" : "#FDFAF1";
          ctx.fillRect(0, 0, innerW, innerH);
          ctx.fillStyle = "#006C47";
          ctx.fillRect(0, 0, innerW, 12);
          ctx.fillStyle = isPass ? "#FFFFFF" : "#1C1C1C";
          ctx.textAlign = "center";
          ctx.font = `900 36px "Cairo", sans-serif`;
          ctx.fillText(c.name, innerW / 2, 66, innerW * 0.88);
          ctx.font = `700 20px "Cairo", sans-serif`;
          ctx.globalAlpha = 0.75;
          ctx.fillText("OFFICIAL ID DOCUMENT • وثيقة رسمية", innerW / 2, 104, innerW * 0.88);
          ctx.globalAlpha = 1;
        }
        ctx.restore();

        ctx.translate(-cw / 2, -ch / 2);
        if (frame.card && c.border && frame.color !== "none" && frame.thickness > 0) {
          ctx.save();
          ctx.strokeStyle = frame.color;
          ctx.lineWidth = Math.max(2, frame.thickness * 4);
          if (frame.style === "dashed") ctx.setLineDash([18, 14]);
          else if (frame.style === "dotted") ctx.setLineDash([4, 12]);
          ctx.strokeRect(0, 0, cw, ch);
          ctx.restore();
        }

        if (frame.guides && c.guides) {
          ctx.save();
          ctx.strokeStyle = "rgba(179, 38, 56, 0.72)";
          ctx.lineWidth = 3.5;
          ctx.setLineDash([14, 14]);
          const bleedPx = 1.2 * PX_PER_MM;
          ctx.strokeRect(-bleedPx, -bleedPx, cw + bleedPx * 2, ch + bleedPx * 2);
          ctx.restore();
        }
        ctx.restore();
      }
      return canvas;
    }

    function buildNativePdf(pagesData) {
      const enc = new TextEncoder();
      const chunks = [];
      const offsets = [];
      let pos = 0;
      const pushBytes = (b) => { chunks.push(b); pos += b.length; };
      const pushStr = (s) => pushBytes(enc.encode(s));

      pushBytes(new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52, 10, 37, 226, 227, 207, 211, 10]));
      const totalObjs = 2 + pagesData.length * 3;
      const kids = pagesData.map((_, idx) => `${3 + idx * 3} 0 R`).join(" ");
      const objs = [
        { num: 1, head: `1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n` },
        { num: 2, head: `2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${pagesData.length} >>\nendobj\n` }
      ];

      pagesData.forEach((p, idx) => {
        const pObj = 3 + idx * 3, iObj = 4 + idx * 3, cObj = 5 + idx * 3;
        const stream = enc.encode(`q ${p.wPt.toFixed(2)} 0 0 ${p.hPt.toFixed(2)} 0 0 cm /Im${idx} Do Q`);
        objs.push({ num: pObj, head: `${pObj} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.wPt.toFixed(2)} ${p.hPt.toFixed(2)}] /Resources << /XObject << /Im${idx} ${iObj} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cObj} 0 R >>\nendobj\n` });
        objs.push({ num: iObj, head: `${iObj} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.pxW} /Height ${p.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`, body: p.jpeg, tail: `\nendstream\nendobj\n` });
        objs.push({ num: cObj, head: `${cObj} 0 obj\n<< /Length ${stream.length} >>\nstream\n`, body: stream, tail: `\nendstream\nendobj\n` });
      });

      objs.sort((a, b) => a.num - b.num);
      for (const o of objs) {
        offsets[o.num] = pos;
        pushStr(o.head);
        if (o.body) pushBytes(o.body);
        if (o.tail) pushStr(o.tail);
      }

      const xrefPos = pos;
      let xref = `xref\n0 ${totalObjs + 1}\n0000000000 65535 f \n`;
      for (let i = 1; i <= totalObjs; i++) xref += `${String(offsets[i] || 0).padStart(10, "0")} 00000 n \n`;
      xref += `trailer\n<< /Size ${totalObjs + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
      pushStr(xref);
      return new Blob(chunks, { type: "application/pdf" });
    }

    function buildPrintableHtml(pagesMap, paperW, paperH, margin, frame = DEFAULT_FRAME) {
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const sheets = pagesMap
        .map(([, pCards]) => {
          const items = pCards
            .map((h) => {
              const src = h.enhancedImage || h.image;
              const cssFallback = h.image && (!h.enhancedImage || h.enhancedImage === h.image)
                ? `filter:${buildCssScannerFilter(h.enhance)};`
                : "";
              const isRot90 = h.rotation === 90 || h.rotation === 270;
              const innerW = isRot90 ? h.h : h.w;
              const innerH = isRot90 ? h.w : h.h;
              const totalAngle = (h.freeRotation || 0) + (h.enhance?.tilt || 0);
              const brd = frame.card && h.border && frame.color !== "none" && frame.thickness > 0 ? `border:${frame.thickness}px ${frame.style} ${frame.color};` : "";
              const gd = frame.guides && h.guides ? '<div style="position:absolute;inset:-1.2mm;border:0.4mm dashed rgba(179,38,56,.7)"></div>' : "";
              const innerContent = src
                ? `<img src="${src}" alt="${esc(h.name)}" style="width:100%;height:100%;object-fit:cover;display:block;${cssFallback}">`
                : `<div style="width:100%;height:100%;background:${h.type === "passport" ? "#17365A" : "#FDFAF1"};color:${h.type === "passport" ? "#fff" : "#1c1c1c"};padding:3mm;text-align:center"><div style="height:1.2mm;background:#006C47"></div><div style="font-weight:900;font-size:11pt;margin-top:4mm">${esc(h.name)}</div><div style="font-size:7pt;opacity:.75;margin-top:2mm">OFFICIAL ID DOCUMENT</div></div>`;
              const body = `<div style="position:absolute;left:50%;top:50%;width:${innerW}mm;height:${innerH}mm;transform:translate(-50%,-50%) rotate(${h.rotation || 0}deg);overflow:hidden">${innerContent}</div>`;
              return `<div class="card" style="left:${h.x}mm;top:${h.y}mm;width:${h.w}mm;height:${h.h}mm;transform:rotate(${totalAngle}deg);${brd}">${body}${gd}</div>`;
            })
            .join("");
          const marginGuide = frame.guides
            ? `<div style="position:absolute;left:${margin}mm;top:${margin}mm;width:${Math.max(0, paperW - margin * 2)}mm;height:${Math.max(0, paperH - margin * 2)}mm;border:0.4mm dashed rgba(179,38,56,.5)"></div>`
            : "";
          const sheetBrd = frame.sheet && frame.color !== "none" && frame.thickness > 0 ? `border:${frame.thickness}px ${frame.style} ${frame.color};` : "";
          return `<section class="sheet" style="background:${frame.bg === "transparent" ? "transparent" : frame.bg === "offwhite" ? "#fdfaf1" : "#ffffff"};${sheetBrd}">${marginGuide}${items}</section>`;
        })
        .join("\n");
      return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طبعتي — ملف الطباعة</title><style>@page{size:${paperW}mm ${paperH}mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#fff}.sheet{width:${paperW}mm;height:${paperH}mm;position:relative;overflow:hidden;background:#fff;page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto;break-after:auto}.card{position:absolute;overflow:hidden}@media print{body{margin:0}}</style></head><body>${sheets}</body></html>`;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

      // Adaptive Fit-to-Screen Calculation

          const availH = Math.max(170, el.clientHeight - padH);
          const sheetPxW = (paperW + (frame.ruler ? 8 : 0)) * 3.7795275591;
          const sheetPxH = (paperH + (frame.ruler ? 8 : 0)) * 3.7795275591;
          const optimal = Math.min(availW / sheetPxW, availH / sheetPxH, 1.35);
          setFitScale(Math.max(0.2, optimal));
        };
        calcFit();
        const ro = new ResizeObserver(calcFit);
        ro.observe(el);

      }, [paperW, paperH, frame.ruler, isEditingTab, isExpanded, viewport]);

      const executePack = useCallback((list, strategy = "smart", preserveManual = false, overrides = {}, customMsg = null) => {
        const opts = {
          paperW,

        const res = arrangeCardsStrict(list, opts);

          notify(`تم الترتيب حسب الحجم من الأكبر للأصغر (${res.pages} ورقة)`);

      }, [paperW, paperH, margin, gap, layoutMode, groupSmart, allowMultiPage, frame.guides, notify]);

      const configSig = `${paperW}x${paperH}|${margin}|${gap}|${layoutMode}|${groupSmart}|${allowMultiPage}|${frame.guides}`;
      const prevSigRef = useRef(configSig);
      useEffect(() => {
        if (prevSigRef.current === configSig) return;

        if (cardsRef.current.length > 0) {
          executePack(cardsRef.current, "smart", true, {}, `تم تحديث الترتيب تلقائياً (${paperW}×${paperH} مم)`);
        }
      }, [configSig, paperW, paperH, executePack]);

      /* ========================================================================
         //*** SCANNER IMAGE ENHANCEMENT (Instant GPU Preview + 300 DPI Pixel Output)
         ======================================================================== */
      const enhanceTimersRef = useRef(new Map());

      const applyEnhancementToAllCards = useCallback(async (sourceEnhance) => {
        const clean = { ...DEFAULT_ENHANCE, ...(sourceEnhance || {}) };
        setIsBusy(true);
        setPendingBulkConfirm(null);
        setCards((prev) => prev.map((c) => (c.image ? { ...c, enhance: clean, bulkEnhanced: true } : c)));
        try {
          const updated = await Promise.all(
            cardsRef.current.map(async (c) => {

              return { ...c, enhance: clean, enhancedImage: processed || c.image, bulkEnhanced: true };
            })
          );
          setCards(updated);
          notify(`تم تطبيق التحسين على كل الصور (${updated.filter((x) => x.image).length} بطاقة)`);
        } finally {
          setIsBusy(false);
        }
      }, [notify]);

      const resetEnhancementAllCards = useCallback(() => {
        setPendingBulkConfirm(null);
        setCards((prev) =>
          prev.map((c) => ({
            ...c,
            enhance: { ...DEFAULT_ENHANCE },

      const applyCardEnhance = useCallback((cardId, patch, bypassBulk = false) => {
        if (!bypassBulk && enhanceScope === "all" && cardsRef.current.length > 1) {
          setPendingBulkConfirm({ kind: "patch", patch });
          return;
        }

        const target = cardsRef.current.find((c) => c.id === cardId);
        if (!target) return;
        const nextEnh = { ...DEFAULT_ENHANCE, ...(target.enhance || {}), ...patch };

        setCards((prev) => prev.map((c) => (c.id === cardId ? { ...c, enhance: nextEnh, bulkEnhanced: false } : c)));
        if (!target.image) return;

        const prevT = enhanceTimersRef.current.get(cardId);
        if (prevT) clearTimeout(prevT);

        const t = setTimeout(async () => {
          try {
            const latest = cardsRef.current.find((c) => c.id === cardId);
            if (!latest?.image) return;
            const processed = await processCardPixels(latest.image, nextEnh);
            if (processed) {
              setCards((prev) => prev.map((c) => (c.id === cardId ? { ...c, enhancedImage: processed } : c)));
            }
          } catch {}
        }, 100);
        enhanceTimersRef.current.set(cardId, t);
      }, [enhanceScope]);

      // Upload & Auto-Detect Image Dimensions
      const handleFiles = async (fileList) => {

        const images = files.filter((f) => f.type.startsWith("image/") || /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(f.name));
        if (!images.length) return notify("يرجى اختيار صور بطاقات صالحة");

        const newCards = [];
        for (const file of images) {
          try {
            const dataUrl = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(String(r.result));

            const dims = await new Promise((res) => {

      const addDemoCards = () => {

      /* ========================================================================
         //*** 360° ROTATION HELPER (Supports 0°..360° Continuous + Magnetic Snaps)
         ======================================================================== */
      const setCardAngle360 = useCallback((cardId, rawAngle, snapMagnetic = false) => {
        let deg = ((Math.round(rawAngle * 10) / 10) % 360 + 360) % 360;
        if (snapMagnetic) {
          const snaps = [0, 45, 90, 135, 180, 225, 270, 315, 360];
          for (const s of snaps) {
            if (Math.abs(deg - s) <= 4.5) {
              deg = s === 360 ? 0 : s;
              break;
            }
          }
        }
        setCards((prev) =>
          prev.map((c) => {
            if (c.id !== cardId) return c;
            const baseW = Number(c.baseW) || ((c.rotation === 90 || c.rotation === 270) ? c.h : c.w);
            const baseH = Number(c.baseH) || ((c.rotation === 90 || c.rotation === 270) ? c.w : c.h);
            // Cleanly swap bounding box on exact 90°/270° angles so packing & guides align 100%
            if (deg === 0 || deg === 180) {
              return { ...c, baseW, baseH, w: baseW, h: baseH, rotation: deg, freeRotation: 0, autoRotated: false };
            }
            if (deg === 90 || deg === 270) {
              return { ...c, baseW, baseH, w: baseH, h: baseW, rotation: deg, freeRotation: 0, autoRotated: false };
            }
            return { ...c, baseW, baseH, w: baseW, h: baseH, rotation: 0, freeRotation: deg, autoRotated: false };
          })
        );
        return deg;
      }, []);

      /* ========================================================================
         //*** INTERACTIVE TOUCH & POINTER: MOVE, RESIZE, 360° ROTATE & LONG-PRESS
         ======================================================================== */
      const clearLongPressTimer = () => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
        setPressingCardId(null);
      };

      const startPointerAction = (e, card, action) => {
        e.preventDefault();
        e.stopPropagation();
        setSelectedId(card.id);
        setInteractingCardId(card.id);
        const sheetEl = e.currentTarget.closest(".physical-sheet") || sheetDomRef.current;
        if (!sheetEl) return;

        const rect = sheetEl.getBoundingClientRect();
        const pxPerMm = rect.width / paperW;
        const startX = e.clientX;
        const startY = e.clientY;
        const origX = card.x;
        const origY = card.y;
        const origW = card.w;
        const origH = card.h;
        let hasMoved = false;

        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}

        // Trigger Long-Press Context Quick Sheet after 430ms if user holds without dragging
        if (action === "move") {
          clearLongPressTimer();
          setPressingCardId(card.id);
          longPressTimerRef.current = setTimeout(() => {
            if (!hasMoved) {
              triggerHaptic(22);
              setPressingCardId(null);
              setLongPressCardId(card.id);
            }
          }, 430);
        }

        const onMove = (ev) => {
          const dxPx = ev.clientX - startX;
          const dyPx = ev.clientY - startY;
          if (Math.hypot(dxPx, dyPx) > 5) {
            hasMoved = true;
            clearLongPressTimer();
          }

          if (action === "rotate") {
            const centerPxX = rect.left + (card.x + card.w / 2) * pxPerMm;
            const centerPxY = rect.top + (card.y + card.h / 2) * pxPerMm;
            const rad = Math.atan2(ev.clientY - centerPxY, ev.clientX - centerPxX);
            const rawDeg = (rad * 180) / Math.PI + 90;
            const appliedDeg = setCardAngle360(card.id, rawDeg, true);
            setLiveAngleBadge(`${Math.round(appliedDeg)}°`);
            return;
          }

          const dxMm = dxPx / pxPerMm;
          const dyMm = dyPx / pxPerMm;
          const boundMin = frame.guides ? margin : 0;
          const boundMaxX = paperW - boundMin;
          const boundMaxY = paperH - boundMin;

          if (action === "move") {
            if (!hasMoved) return;
            const nx = Math.max(boundMin, Math.min(boundMaxX - card.w, origX + dxMm));
            const ny = Math.max(boundMin, Math.min(boundMaxY - card.h, origY + dyMm));
            setCards((prev) =>
              prev.map((c) =>
                c.id === card.id ? { ...c, x: Math.round(nx * 10) / 10, y: Math.round(ny * 10) / 10, manual: true } : c
              )
            );
          } else if (action === "resize") {
            const nw = Math.max(20, Math.min(boundMaxX - origX, origW + dxMm));
            const nh = Math.max(20, Math.min(boundMaxY - origY, origH + dyMm));
            setCards((prev) =>
              prev.map((c) =>
                c.id === card.id
                  ? { ...c, baseW: Math.round(nw * 10) / 10, baseH: Math.round(nh * 10) / 10, w: Math.round(nw * 10) / 10, h: Math.round(nh * 10) / 10 }
                  : c
              )
            );
          }
        };

        const onUp = () => {
          clearLongPressTimer();
          setInteractingCardId(null);
          setLiveAngleBadge(null);
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          window.removeEventListener("pointercancel", onUp);
        };

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      };

      const updateCard = (id, patch) => {

        const copy = { ...src, id: ++cardUid, manual: false };
        setSelectedId(copy.id);
        if (autoArrangeOnAdd) {

        } else {
          setCards([
            ...cards,
            { ...copy, x: Math.min(src.x + 8, paperW - src.w), y: Math.min(src.y + 8, paperH - src.h) }
          ]);
          notify("تم نسخ البطاقة");
        }
      };

      const deleteCard = (id) => {
        const next = cards.filter((c) => c.id !== id);
        setCards(next);
        if (selectedId === id) setSelectedId(next[0]?.id || 0);
        if (longPressCardId === id) setLongPressCardId(null);

      // Replace Card Image in Place
      const triggerReplaceCardImage = (id) => {
        replacingCardIdRef.current = id;
        replaceFileInputRef.current?.click();
      };

      const handleReplaceFileChange = async (e) => {
        const file = e.target.files?.[0];
        const targetId = replacingCardIdRef.current;
        e.target.value = "";
        if (!file || !targetId) return;
        try {
          const dataUrl = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(String(r.result));
            r.onerror = rej;
            r.readAsDataURL(file);
          });
          updateCard(targetId, {
            image: dataUrl,
            enhancedImage: dataUrl,
            originalImage: null,
            enhance: { ...DEFAULT_ENHANCE }
          });
          notify("تم استبدال صورة البطاقة بنفس القياس والموضع");
        } catch {
          notify("تعذر استبدال الصورة");
        }
      };

      // Swap Positions Between Any Two Cards Across Sheets
      const swapCardsPositions = (idA, idB) => {
        if (idA === idB) return;
        const cardA = cards.find((c) => c.id === idA);
        const cardB = cards.find((c) => c.id === idB);
        if (!cardA || !cardB) return;

        setCards((prev) =>
          prev.map((c) => {
            if (c.id === idA) return { ...c, x: cardB.x, y: cardB.y, page: cardB.page, manual: true };
            if (c.id === idB) return { ...c, x: cardA.x, y: cardA.y, page: cardA.page, manual: true };
            return c;
          })
        );
        setActivePage(cardB.page || 0);
        setSwapModalCardId(null);
        notify(`تم تبديل الموضع مع "${cardB.name}" في ورقة ${(cardB.page || 0) + 1}`);
      };

      // Move Card Manually to Another Sheet
      const moveCardToPage = (cardId, targetPageIdx) => {
        const card = cards.find((c) => c.id === cardId);
        if (!card) return;
        const existingOnTarget = cards.filter((c) => (c.page || 0) === targetPageIdx && c.id !== cardId);
        const maxBottom = existingOnTarget.length ? Math.max(...existingOnTarget.map((c) => c.y + c.h)) : margin;
        const nextY = Math.min(Math.max(margin, maxBottom + gap), Math.max(margin, paperH - margin - card.h));
        updateCard(cardId, { page: targetPageIdx, x: margin, y: Math.round(nextY * 10) / 10, manual: true });
        setActivePage(targetPageIdx);
        notify(`تم نقل البطاقة يدوياً إلى ورقة ${targetPageIdx + 1}`);
      };

      // Smart Edge-Aware Auto-Crop
      const autoCropCard = async (id) => {
        const c = cards.find((item) => item.id === id);
        if (!c?.image) return;
        setIsBusy(true);
        try {
          const img = await loadImage(c.image);
          const w = img.naturalWidth, h = img.naturalHeight;
          const cvs = document.createElement("canvas");
          cvs.width = w; cvs.height = h;
          const ctx = cvs.getContext("2d");
          ctx.drawImage(img, 0, 0);
          const data = ctx.getImageData(0, 0, w, h).data;

          let sumR = 0, sumG = 0, sumB = 0, samples = 0;
          const addSample = (px, py) => {
            const idx = (py * w + px) * 4;
            sumR += data[idx]; sumG += data[idx + 1]; sumB += data[idx + 2]; samples++;
          };
          for (let x = 0; x < w; x += Math.max(1, Math.floor(w / 40))) {
            addSample(x, 1); addSample(x, h - 2);
          }
          for (let y = 0; y < h; y += Math.max(1, Math.floor(h / 40))) {
            addSample(1, y); addSample(w - 2, y);
          }
          const bgR = sumR / samples, bgG = sumG / samples, bgB = sumB / samples;

          const isBgPixel = (x, y) => {
            const idx = (y * w + x) * 4;
            const dr = data[idx] - bgR, dg = data[idx + 1] - bgG, db = data[idx + 2] - bgB;
            return Math.sqrt(dr * dr + dg * dg + db * db) < 44;
          };

          let top = 0, bottom = h - 1, left = 0, right = w - 1;
          const rowEmpty = (y) => {
            let bgCount = 0, total = 0;
            for (let x = 0; x < w; x += 3) { total++; if (isBgPixel(x, y)) bgCount++; }
            return bgCount > total * 0.88;
          };
          const colEmpty = (x) => {
            let bgCount = 0, total = 0;
            for (let y = 0; y < h; y += 3) { total++; if (isBgPixel(x, y)) bgCount++; }
            return bgCount > total * 0.88;
          };

          while (top < h - 12 && rowEmpty(top)) top++;
          while (bottom > top + 12 && rowEmpty(bottom)) bottom--;
          while (left < w - 12 && colEmpty(left)) left++;
          while (right > left + 12 && colEmpty(right)) right--;

          const cropW = right - left + 1;
          const cropH = bottom - top + 1;
          if (cropW < w * 0.35 || cropH < h * 0.35 || (cropW > w * 0.97 && cropH > h * 0.97)) {
            notify("لم نجد حواف زائدة واضحة للقص — بقيت الصورة كما هي");
            return;
          }
          const out = document.createElement("canvas");
          out.width = cropW; out.height = cropH;
          out.getContext("2d").drawImage(img, left, top, cropW, cropH, 0, 0, cropW, cropH);
          const croppedUrl = out.toDataURL("image/png");
          const nextEnh = { ...(c.enhance || DEFAULT_ENHANCE), crop: Math.round((1 - (cropW * cropH) / (w * h)) * 100) };
          const reEnhanced = await processCardPixels(croppedUrl, nextEnh);
          updateCard(id, {
            originalImage: c.originalImage || c.image,
            image: croppedUrl,
            enhancedImage: reEnhanced || croppedUrl,
            enhance: nextEnh
          });
          notify(`تم القص التلقائي للحواف — أُزيلت الزوائد (${nextEnh.crop}%)`);
        } catch {
          notify("تعذر القص التلقائي — جرّب تحسين السطوع والتباين");
        } finally {
          setIsBusy(false);
        }
      };

      /* ========================================================================
         //*** EXPORT, PRINT & SHARE ACTIONS (300 DPI PDF, PNGs, HTML, Social Share)
         ======================================================================== */
      const buildPdfBlobForAllPages = async () => {
        const pdfPages = [];
        for (const [, pCards] of pagesMap) {
          const cvs = await renderSheetToCanvas(pCards, paperW, paperH, margin, frame);
          const b64 = cvs.toDataURL("image/jpeg", 0.92).split(",")[1] || "";
          const bin = atob(b64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          pdfPages.push({
            jpeg: bytes,
            pxW: cvs.width,
            pxH: cvs.height,
            wPt: paperW * 2.83464567,
            hPt: paperH * 2.83464567
          });
        }
        return buildNativePdf(pdfPages);
      };

      const navDestinations = [

      const confirmDeletePageKeepCards = () => {
        if (deletePageModalIdx === null) return;
        const idx = deletePageModalIdx;
        setDeletePageModalIdx(null);
        const countOnPage = cards.filter((c) => (c.page || 0) === idx).length;
        if (countOnPage === 0) {
          setExtraPages((e) => Math.max(0, e - 1));
          setActivePage((p) => (idx <= p ? Math.max(0, p - 1) : p));
          notify("تم حذف الورقة — كانت فارغة");
          return;
        }
        const shifted = cards.map((c) => {
          if ((c.page || 0) === idx) return { ...c, page: Math.max(0, idx - 1), manual: false };
          if ((c.page || 0) > idx) return { ...c, page: c.page - 1 };
          return c;
        });
        executePack(shifted, "smart", true, {}, `تم حذف الورقة — تم نقل ${countOnPage} بطاقة إلى الأوراق الباقية`);
        setActivePage((p) => (idx <= p ? Math.max(0, p - 1) : p));
      };

        const remaining = cards
          .filter((c) => (c.page || 0) !== idx)
          .map((c) => ((c.page || 0) > idx ? { ...c, page: c.page - 1 } : c));
        setCards(remaining);
        if (remaining.length === 0) {
          setExtraPages(0);
          setActivePage(0);
        } else {
          setActivePage((p) => (idx <= p ? Math.max(0, p - 1) : p));

          setFrame((f) => ({ ...f, sheet: true, card: true, guides: true, ruler: true }));

          notify("تم إخفاء كل الإطارات — طباعة نظيفة بدون أي إطار");
        }
      };

      return (
        <div

          style={{
            backgroundColor: "var(--md-canvas)",
            color: "var(--md-on-surface)",
            paddingLeft: "var(--safe-left)",
            paddingRight: "var(--safe-right)"
          }}
        >
          <input ref={fileInputRef} type="file" multiple accept="image/*" className="hidden" onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
          <input ref={replaceFileInputRef} type="file" accept="image/*" className="hidden" onChange={handleReplaceFileChange} />
          <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />

          {/* ====================================================================

                    >

                      duplicateCard(targetId);
                    }}
                    className="p-3 rounded-2xl flex items-center gap-2 text-xs font-extrabold fluid-btn"
                    style={{ backgroundColor: "var(--md-surface-container)" }}
                  >
                    <Icon name="content_copy" size={18} />
                    <span>نسخ البطاقة</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => deleteCard(longPressedCard.id)}
                    className="p-3 rounded-2xl flex items-center gap-2 text-xs font-black fluid-btn"
                    style={{ backgroundColor: "var(--md-tertiary-container)", color: "var(--md-on-tertiary-container)" }}
                  >
                    <Icon name="delete" size={18} />
                    <span>حذف البطاقة</span>
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* ====================================================================
              6. EXPORT, PRINT, PNG, HTML & SOCIAL SHARE SHEET
              ==================================================================== */}
          <div
            className={`no-print fixed inset-0 z-50 flex items-end md:items-center justify-center p-3 m3-backdrop ${
              shareSheetOpen ? "is-open" : ""
            }`}
            style={{ backgroundColor: "rgba(0,0,0,0.45)" }}
            onClick={() => setShareSheetOpen(false)}
          >
            <div
              className="w-full max-w-md rounded-3xl p-4 space-y-2.5 shadow-2xl m3-dialog"
              style={{
                backgroundColor: "var(--md-surface-high)",
                color: "var(--md-on-surface)",
                border: "1px solid var(--md-outline-variant)"
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between px-1 pb-1">
                <span className="text-sm font-black">تصدير ومشاركة وطباعة</span>
                <button type="button" onClick={() => setShareSheetOpen(false)} className="w-8 h-8 rounded-full flex items-center justify-center fluid-btn">
                  <Icon name="close" size={18} />
                </button>
              </div>

              <button
                type="button"
                onClick={triggerSystemPrint}
                className="w-full p-3 rounded-2xl flex items-center gap-3 text-right fluid-btn"
                style={{ backgroundColor: "var(--md-primary)", color: "var(--md-on-primary)" }}
              >
                <Icon name="print" size={22} />
                <div className="flex-1">
                  <div className="text-xs font-black">طباعة مباشرة عبر الطابعة</div>
                  <div className="text-[10px] opacity-85">بقياس حقيقي 100% بدون تصغير</div>
                </div>
              </button>

              <div className="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={exportCurrentPng}
                  className="p-3 rounded-2xl flex flex-col items-start gap-1 text-right fluid-btn"
                  style={{ backgroundColor: "var(--md-surface-container)" }}
                >
                  <Icon name="image" size={20} />
                  <span className="text-xs font-extrabold">صورة PNG الحالية</span>
                  <span className="text-[10px] opacity-70">ورقة {currentPageIdx + 1} فقط</span>
                </button>

                <button
                  type="button"
                  onClick={exportAllPngs}
                  className="p-3 rounded-2xl flex flex-col items-start gap-1 text-right fluid-btn"
                  style={{ backgroundColor: "var(--md-surface-container)" }}
                >
                  <Icon name="collections" size={20} />
                  <span className="text-xs font-extrabold">جميع الأوراق PNG</span>
                  <span className="text-[10px] opacity-70">{pageCount} صور بدقة 300 DPI</span>
                </button>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={exportHtmlFile}
                  className="p-3 rounded-2xl flex flex-col items-start gap-1 text-right fluid-btn"
                  style={{ backgroundColor: "var(--md-surface-container)" }}
                >
                  <Icon name="code" size={20} />
                  <span className="text-xs font-extrabold">ملف طباعة HTML</span>
                  <span className="text-[10px] opacity-70">نسخة ويب مستقلة 100%</span>
                </button>

                <button
                  type="button"
                  onClick={shareToSocialApps}
                  className="p-3 rounded-2xl flex flex-col items-start gap-1 text-right fluid-btn"
                  style={{ backgroundColor: "var(--md-surface-container)" }}
                >
                  <Icon name="ios_share" size={20} />
                  <span className="text-xs font-extrabold">مشاركة للتطبيقات</span>
                  <span className="text-[10px] opacity-70">واتساب، تيليجرام، بريد</span>
                </button>
              </div>
            </div>
          </div>

          {/* ====================================================================
              7. IMPORT GALLERY / CAMERA / DEMO CARDS SHEET
              ==================================================================== */}
          <div
            className={`no-print fixed inset-0 z-50 flex items-end md:items-center justify-center p-3 m3-backdrop ${
              importMenuOpen ? "is-open" : ""
            }`}
            style={{ backgroundColor: "rgba(0,0,0,0.45)" }}
            onClick={() => setImportMenuOpen(false)}
          >
            <div
              className="w-full max-w-sm rounded-3xl p-4 space-y-2.5 shadow-2xl m3-dialog"
              style={{
                backgroundColor: "var(--md-surface-high)",
                color: "var(--md-on-surface)",
                border: "1px solid var(--md-outline-variant)"
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between px-1 pb-1">
                <span className="text-sm font-black">إضافة بطاقات أو مستندات</span>
                <button type="button" onClick={() => setImportMenuOpen(false)} className="w-8 h-8 rounded-full flex items-center justify-center fluid-btn">
                  <Icon name="close" size={18} />
                </button>
              </div>

              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                className="w-full p-3.5 rounded-2xl flex items-center gap-3 text-right fluid-btn"
                style={{ backgroundColor: "var(--md-primary)", color: "var(--md-on-primary)" }}
              >
                <Icon name="collections" size={22} />
                <div>
                  <div className="text-xs font-black">فتح الاستوديو واختيار الصور</div>
                  <div className="text-[10px] opacity-85">التعرف التلقائي على الأبعاد الحقيقية</div>
                </div>
              </button>

              <button
                type="button"
                onClick={() => cameraInputRef.current?.click()}
                className="w-full p-3.5 rounded-2xl flex items-center gap-3 text-right fluid-btn"
                style={{ backgroundColor: "var(--md-secondary-container)", color: "var(--md-on-secondary-container)" }}
              >
                <Icon name="camera" size={22} />
                <div>
                  <div className="text-xs font-black">التقاط صورة بالكاميرا</div>
                  <div className="text-[10px] opacity-85">تصوير مباشر للبطاقة أو الجواز</div>
                </div>
              </button>

              <button
                type="button"
                onClick={() => { setImportMenuOpen(false); addDemoCards(); }}
                className="w-full p-3 rounded-2xl flex items-center gap-3 text-right fluid-btn"
                style={{ backgroundColor: "var(--md-surface-container)" }}
              >
                <Icon name="auto_awesome" size={20} />
                <div>
                  <div className="text-xs font-extrabold">إضافة بطاقات تجريبية بالمقاسات الرسمية</div>
                  <div className="text-[10px] opacity-75">وطنية، جواز سفر، بطاقة سكن</div>
                </div>
              </button>
            </div>
          </div>

          {/* ====================================================================
              8. SWAP CARD POSITION DIALOG
              ==================================================================== */}
          <div
            className={`no-print fixed inset-0 z-50 flex items-end md:items-center justify-center p-3 m3-backdrop ${
              swapModalCardId !== null ? "is-open" : ""
            }`}
            style={{ backgroundColor: "rgba(0,0,0,0.45)" }}
            onClick={() => setSwapModalCardId(null)}
          >
            <div
              className="w-full max-w-sm rounded-3xl p-4 space-y-2.5 shadow-2xl m3-dialog"
              style={{
                backgroundColor: "var(--md-surface-high)",
                color: "var(--md-on-surface)",
                border: "1px solid var(--md-outline-variant)"
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between px-1 pb-1">
                <span className="text-sm font-black">اختر البطاقة لتبديل مكانها</span>
                <button type="button" onClick={() => setSwapModalCardId(null)} className="w-8 h-8 rounded-full flex items-center justify-center fluid-btn">
                  <Icon name="close" size={18} />
                </button>
              </div>
              <div className="max-h-60 overflow-y-auto space-y-1.5">
                {cards
                  .filter((c) => c.id !== swapModalCardId)
                  .map((target) => (
                    <button
                      key={target.id}
                      type="button"
                      onClick={() => swapCardsPositions(swapModalCardId, target.id)}
                      className="w-full p-3 rounded-2xl flex items-center justify-between text-xs font-extrabold fluid-btn"
                      style={{ backgroundColor: "var(--md-surface-container)" }}
                    >
                      <span>{target.name}</span>
                      <span className="opacity-70">ورقة {(target.page || 0) + 1} • {target.w}×{target.h}</span>
                    </button>
                  ))}
              </div>
            </div>
          </div>

          {/* ====================================================================
              9. DELETE SHEET CONFIRMATION DIALOG
              ==================================================================== */}
          <div
            className={`no-print fixed inset-0 z-50 flex items-end md:items-center justify-center p-3 m3-backdrop ${
              deletePageModalIdx !== null ? "is-open" : ""
            }`}
            style={{ backgroundColor: "rgba(0,0,0,0.45)" }}
            onClick={() => setDeletePageModalIdx(null)}
          >
            <div
              className="w-full max-w-sm rounded-3xl p-4 space-y-2.5 shadow-2xl m3-dialog"
              style={{
                backgroundColor: "var(--md-surface-high)",
                color: "var(--md-on-surface)",
                border: "1px solid var(--md-outline-variant)"
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between px-1">
                <span className="text-sm font-black">حذف ورقة {(deletePageModalIdx ?? 0) + 1}؟</span>
                <button type="button" onClick={() => setDeletePageModalIdx(null)} className="w-8 h-8 rounded-full flex items-center justify-center fluid-btn">
                  <Icon name="close" size={18} />
                </button>
              </div>
              <p className="text-xs opacity-80 px-1 leading-relaxed">
                الورقة تحتوي على <strong>{cards.filter((c) => (c.page || 0) === deletePageModalIdx).length} بطاقة</strong>. اختر الإجراء المناسب:
              </p>
              <div className="space-y-2 pt-1">
                <button
                  type="button"
                  onClick={confirmDeletePageKeepCards}
                  className="w-full py-2.5 rounded-full text-xs font-black fluid-btn"
                  style={{ backgroundColor: "var(--md-primary)", color: "var(--md-on-primary)" }}
                >
                  حذف الورقة مع بقاء البطاقات
                </button>
                <button
                  type="button"
                  onClick={confirmDeletePageWithCards}
                  className="w-full py-2.5 rounded-full text-xs font-black fluid-btn"
                  style={{ backgroundColor: "var(--md-tertiary)", color: "var(--md-on-tertiary)" }}
                >
                  حذف الورقة مع البطاقات
                </button>
              </div>
            </div>
          </div>

          {/* ====================================================================
              10. START OVER CONFIRMATION DIALOG
              ==================================================================== */}
          <div
            className={`no-print fixed inset-0 z-50 flex items-end md:items-center justify-center p-3 m3-backdrop ${
              resetConfirmOpen ? "is-open" : ""
            }`}
            style={{ backgroundColor: "rgba(0,0,0,0.45)" }}
            onClick={() => setResetConfirmOpen(false)}
          >
            <div
              className="w-full max-w-xs rounded-3xl p-4 space-y-3 shadow-2xl m3-dialog"
              style={{
                backgroundColor: "var(--md-surface-high)",
                color: "var(--md-on-surface)",
                border: "1px solid var(--md-outline-variant)"
              }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex items-center justify-between px-1">
                <span className="text-sm font-black">إلغاء والبدء من جديد؟</span>
                <button type="button" onClick={() => setResetConfirmOpen(false)} className="w-8 h-8 rounded-full flex items-center justify-center fluid-btn">
                  <Icon name="close" size={18} />
                </button>
              </div>
              <p className="text-xs opacity-80 px-1 leading-relaxed">
                سيتم مسح جميع البطاقات والأوراق الحالية والعودة إلى ورقة فارغة نظيفة.
              </p>
              <div className="grid grid-cols-2 gap-2 pt-1">
                <button
                  type="button"
                  onClick={() => setResetConfirmOpen(false)}
                  className="py-2.5 rounded-full text-xs font-extrabold fluid-btn"
                  style={{ backgroundColor: "var(--md-surface-highest)" }}
                >
                  تراجع
                </button>
                <button
                  type="button"
                  onClick={resetWorkspaceAll}
                  className="py-2.5 rounded-full text-xs font-black fluid-btn"
                  style={{ backgroundColor: "var(--md-tertiary)", color: "var(--md-on-tertiary)" }}
                >
                  تأكيد البدء
                </button>
              </div>
            </div>
          </div>

          {/* ====================================================================
              11. M3 EXPRESSIVE FLUID SNACKBAR NOTIFICATION
              ==================================================================== */}
          {(toast || isBusy) && (
            <div className="no-print fixed top-16 inset-x-4 z-50 flex justify-center pointer-events-none m3-float-enter">
              <div
                className="px-3.5 py-2 rounded-full text-xs font-extrabold shadow-xl flex items-center gap-2.5 backdrop-blur-md"
                style={{
                  backgroundColor: "var(--md-on-surface)",
                  color: "var(--md-surface)",
                  border: "1px solid var(--md-outline-variant)"
                }}
              >
                {isBusy ? (
                  <span
                    className="w-4 h-4 inline-block m3-star-loader shrink-0"
                    style={{ backgroundColor: "var(--md-primary-container)" }}
                  />
                ) : (
                  <span
                    className="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
                    style={{
                      backgroundColor: "var(--md-primary-container)",
                      color: "var(--md-on-primary-container)"
                    }}
                  >
                    <Icon name="check" size={13} />
                  </span>
                )}
                <span>{isBusy ? (toast || "جارٍ المعالجة...") : toast}</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
