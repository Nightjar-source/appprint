# AndroidX
android.useAndroidX=true
# Non-transitive R classes: app resources are not leaked across modules (smaller R, faster builds)
android.nonTransitiveRClass=true
# Compile SDK 37 (Android 17) is newer than AGP 9.2's built-in max — silence the lint gate (same pattern as the reference project)
android.suppressUnsupportedCompileSdk=37

# Kotlin
kotlin.code.style=official

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Keep full error traces readable in CLI builds
org.gradle.warning.mode=summary
