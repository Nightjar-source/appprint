# Version catalog — AppPrint (مطبعة البطاقات العراقية) · Kotlin Multiplatform
# All versions re-audited on 2026-11-13 via klibs.io MCP (getLatestVersion) + Google Maven
# metadata (AGP / AndroidX — not indexed on klibs) + developer.android.com (AGP↔Gradle matrix).
# See DEPENDENCY_AUDIT.md. Nothing below has a newer *stable* release.

[versions]
agp = "9.2.1"          # newest AGP line compatible with the untouched Gradle 9.4.1 wrapper (AGP 9.2.x ↔ Gradle 9.4.1)
kotlin = "2.4.21"      # latest stable on Maven Central (2.5.0-Beta2 ignored)
composeMultiplatform = "1.12.2"  # JetBrains Compose Multiplatform — proven with AGP 9.2.x + Kotlin 2.4.21 (reference project line)
navigation3 = "1.2.1"   # androidx.navigation3 (multiplatform artifacts, klibs latestStableVersion=1.2.1)
adaptive = "1.3.0"   # org.jetbrains.compose.material3.adaptive — Compose Adaptive API (multiplatform, latestStableVersion=1.3.0)
navigation3Multiplatform = "1.2.0"  # org.jetbrains.androidx.navigation3:navigation3-ui — KMP UI variant (klibs stable=1.2.0)
lifecycle = "2.11.0"   # org.jetbrains.androidx.lifecycle — latestStableVersion via klibs.io
coroutines = "1.11.0"  # latestStableVersion via klibs.io
serialization = "1.13.0"  # latestStableVersion via klibs.io
coreKtx = "1.19.1"     # Google Maven release
activity = "1.13.0"    # Google Maven release
coreSplashscreen = "1.2.0"
exifinterface = "1.4.2"   # androidx.exifinterface — EXIF orientation (stable on Google Maven, verified Nov 2026)  # Google Maven release
material3Expressive = "1.12.0-alpha03"  # org.jetbrains.compose.material3 — the ONLY line carrying Material3 *Expressive* APIs (decoupled Material3 versioning; forced everywhere)
junit4 = "4.13.2"

[libraries]
# Android app only
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Compose Multiplatform (org.jetbrains.* republished KMP artifacts — klibs.io verified)
lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
navigation3-ui-multiplatform = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3Multiplatform" }
material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
material3-expressive = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3Expressive" }
ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "composeMultiplatform" }
ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# AGP 9.x built-in Kotlin — no org.jetbrains.kotlin.android / kotlin-android plugin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
