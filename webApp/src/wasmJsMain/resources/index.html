<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161D19">
  <meta name="description" content="طبعتي — استوديو الطباعة الذكي 1:1 · ترتيب البطاقات والهويات على ورقة بمقياس حقيقي">
  <title>طبعتي — استوديو الطباعة الذكي 1:1</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #161D19; overflow: hidden; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #B3263E;
      font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="loading">طبعتي…</div>
  <script>
    // Surface any boot failure visibly and in `window.__bootError` for diagnostics.
    window.__bootError = null;
    function reportBootError(prefix, reason) {
      window.__bootError = prefix + ': ' + (reason && (reason.message || reason.reason || reason) || 'unknown');
      document.title = 'BOOT ERROR — ' + window.__bootError;
      console.error(window.__bootError);
    }
    window.addEventListener('error', function (e) { reportBootError('error', e); });
    window.addEventListener('unhandledrejection', function (e) { reportBootError('promise', e); });
  </script>
  <script type="module">
    const removeLoading = () => document.getElementById('loading')?.remove();
    window.addEventListener('load', removeLoading);
    window.addEventListener('error', removeLoading);
    if ('serviceWorker' in navigator) {
      // Versioned URL forces a fresh worker even when GitHub Pages caches sw.js for 10 minutes.
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=2.1.36').catch(() => {}));
    }
  </script>
  <noscript><p>الرجاء تمكين JavaScript لتشغيل تطبيق طبعتي.</p></noscript>
  <script src="webApp.js"></script>
</body>
</html>
