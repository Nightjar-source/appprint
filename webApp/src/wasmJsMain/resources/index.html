<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161D19">
  <meta name="description" content="طبعتي — استوديو الطباعة الذكي 1:1 · ترتيب البطاقات والهويات على ورقة بمقياس حقيقي">
  <title>طبعتي — استوديو الطباعة الذكي 1:1</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #161D19; overflow: hidden; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #B3263E;
      font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="loading">طبعتي…</div>
  <script type="module">
    const removeLoading = () => document.getElementById('loading')?.remove();
    window.addEventListener('load', removeLoading);
    window.addEventListener('error', removeLoading);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
  <noscript><p>الرجاء تمكين JavaScript لتشغيل تطبيق طبعتي.</p></noscript>
  <script src="webApp.js"></script>
</body>
</html>
